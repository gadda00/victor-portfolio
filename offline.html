<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're Offline — Victor Ndunda</title>
<meta name="description" content="This page isn't cached. Reconnect to continue — or revisit a page you've already opened." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0a0e1a" />
<meta name="color-scheme" content="dark light" />
<style>
  :root {
    --bg: #0a0e1a; --bg-card: #111627; --text: #e8ecf4; --text-muted: #9aa4b8;
    --accent: #00d4ff; --accent-2: #7c3aed; --border: rgba(255,255,255,0.09);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse 600px 300px at 30% 0%, rgba(0,212,255,0.08), transparent 70%),
                radial-gradient(ellipse 600px 300px at 70% 10%, rgba(124,58,237,0.08), transparent 70%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .card {
    max-width: 480px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 2.5rem 2rem;
  }
  .icon {
    width: 64px; height: 64px;
    margin: 0 auto 1.25rem;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(124,58,237,0.15));
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
  }
  h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin-bottom: 0.6rem; }
  p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 0.75rem; }
  p.small { font-size: 0.8rem; opacity: 0.85; }
  .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
  a.btn, button.btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.65rem 1.25rem;
    border-radius: 10px;
    font-size: 0.9rem; font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    transition: border-color 0.2s, transform 0.2s;
  }
  a.btn:hover, button.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; }
  @media (prefers-reduced-motion: reduce) { a.btn, button.btn { transition: none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>This page isn't cached, so it can't load without a connection. Pages you've already visited still work — including the home page and services.</p>
    <p class="small">Your estimates and briefs are saved on this device and will sync nothing — everything runs locally either way.</p>
    <div class="actions">
      <button class="btn primary" onclick="location.reload()">↻ Try again</button>
      <a class="btn" href="/">← Go to Home</a>
      <a class="btn" href="/services/">Services</a>
    </div>
  </main>
</body>
</html>
