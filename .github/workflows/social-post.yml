name: Auto-Post to Social Media

on:
  push:
    branches: [main]
    paths: ['blog/articles/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect new/modified articles
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Compare the full push range (falls back to HEAD~1 for singular commits)
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE $AFTER"
          else
            RANGE="HEAD~1 HEAD"
          fi

          # Announce articles that are NEW, or whose <title>/<meta description>
          # changed. Pure code/maintenance tweaks (a11y fixes, script patches)
          # must NOT re-announce old articles.
          announce() {
            local f="$1"
            # New file? -> announce
            if ! git cat-file -e "$BEFORE:$f" 2>/dev/null && [ -n "$BEFORE" ]; then
              echo "$f"; return
            fi
            # Title or description changed? -> announce
            local old_t new_t old_d new_d
            old_t=$(git show "$BEFORE:$f" 2>/dev/null | grep -oP '<title>\K[^<]+' | head -1)
            new_t=$(git show "$AFTER:$f" 2>/dev/null  | grep -oP '<title>\K[^<]+' | head -1)
            old_d=$(git show "$BEFORE:$f" 2>/dev/null | grep -oP '<meta name="description" content="\K[^"]+' | head -1)
            new_d=$(git show "$AFTER:$f" 2>/dev/null  | grep -oP '<meta name="description" content="\K[^"]+' | head -1)
            if [ "$old_t" != "$new_t" ] || [ "$old_d" != "$new_d" ]; then
              echo "$f"
            fi
          }

          FILES=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            hit=$(announce "$f")
            [ -n "$hit" ] && FILES="$FILES$hit"$'\n'
          done < <(git diff --name-only $RANGE -- 'blog/articles/' 2>/dev/null | grep '\.html$' || true)

          # Multiline output via heredoc delimiter (GitHub Actions standard)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "files<<$EOF"
            echo "$FILES"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$FILES" ]; then
            echo "Articles to announce:"
            echo "$FILES"
          else
            echo "No new or re-titled articles detected (maintenance-only changes are skipped)."
          fi

      - name: Setup Python
        if: steps.detect.outputs.files != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Post to all social media
        if: steps.detect.outputs.files != ''
        env:
          DETECTED_FILES: ${{ steps.detect.outputs.files }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          # Robust loop: files arrive via env (never inlined into the script),
          # so any number of articles — including multiline lists — is safe.
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            FILENAME=$(basename "$FILE")
            TITLE=$(grep -oP '<title>\K[^<]+' "$FILE" | sed 's/ — Victor Ndunda//' || echo "New Article")
            DESC=$(grep -oP '<meta name="description" content="\K[^"]+' "$FILE" || echo "")
            URL="https://victorndunda.com/blog/articles/$FILENAME"

            echo "=== Posting: $TITLE ==="
            ARTICLE_TITLE="$TITLE" ARTICLE_DESC="$DESC" ARTICLE_URL="$URL" \
              python3 scripts/social_post.py
          done <<< "$DETECTED_FILES"

      - name: Summary
        if: steps.detect.outputs.files != ''
        run: |
          echo "=== Social Media Auto-Post Complete ==="
          echo "Articles processed:"
          echo "${{ steps.detect.outputs.files }}"
          echo ""
          echo "Active platforms:"
          echo "  LinkedIn: LINKEDIN_ACCESS_TOKEN"
          echo "  X/Twitter: X_OAUTH2_CLIENT_ID + X_OAUTH2_REFRESH_TOKEN (OAuth 2.0, auto-refresh)"
          echo "  TikTok: TIKTOK_ACCESS_TOKEN (video pipeline — under review)"
          echo ""
          echo "Note: If any platform fails, check token permissions (see SOCIAL-CMS.md)"
          echo "X OAuth 2.0 refresh tokens expire in 6 months — regenerate at:"
          echo "  https://developer.x.com > App > OAuth 2.0 > Generate tokens"
