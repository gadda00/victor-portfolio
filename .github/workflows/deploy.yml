name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # v21: the full quality suite (quality.yml) must pass on the pushed
  # commit before anything is deployed — deploy no longer gates on the
  # static validator alone.
  quality:
    name: Quality gates (see quality.yml)
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  validate:
    name: Validate site (fast pre-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run site quality gate
        run: python3 scripts/validate_site.py

  build:
    needs: [quality, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # cycle 17: publish the public allowlist only — internal docs, the owner
      # dashboard suite, marketing packs and repo tooling stay in the repo,
      # off the public website (they were previously served at their paths).
      - name: Assemble public site
        run: |
          mkdir -p _site
          rsync -a --exclude-from=deploy-exclude.txt ./ _site/
          touch _site/.nojekyll
          echo "--- public site manifest (top level) ---"
          ls -A _site
          echo "--- excluded-path sanity checks (all must be absent) ---"
          for p in admin dashboard jobs guide scripts marketing .github MARKETING-STRATEGY.md auth.js; do
            test ! -e "_site/$p" && echo "ok  $p excluded" || echo "FAIL $p LEAKED"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
