name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # v21: the full quality suite (quality.yml) must pass on the pushed
  # commit before anything is deployed — deploy no longer gates on the
  # static validator alone.
  quality:
    name: Quality gates (see quality.yml)
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  validate:
    name: Validate site (fast pre-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run site quality gate
        run: python3 scripts/validate_site.py

  build:
    needs: [quality, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # cycle 20: repo tooling, internal notes and marketing packs stay out;
      # the owner dashboard suite (admin/ dashboard/ jobs/ guide/) is published
      # again per owner request — noindex pages, client-side gated by auth.js,
      # and kept out of the service-worker offline cache.
      - name: Assemble public site
        run: |
          mkdir -p _site
          rsync -a --exclude-from=deploy-exclude.txt ./ _site/
          touch _site/.nojekyll
          echo "--- public site manifest (top level) ---"
          ls -A _site
          echo "--- excluded-path sanity checks (all must be absent) ---"
          for p in scripts marketing .github node_modules qa MARKETING-STRATEGY.md data-inventory.json package.json; do
            test ! -e "_site/$p" && echo "ok  $p excluded" || echo "FAIL $p LEAKED"
          done
          echo "--- owner-suite presence checks (deployed, must exist) ---"
          for p in dashboard/index.html admin/index.html jobs/index.html guide/index.html auth.js totp.js qr-lib.js; do
            test -e "_site/$p" && echo "ok  $p present" || echo "FAIL $p MISSING"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
