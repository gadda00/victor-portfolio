name: Update Sitemap & Feed

on:
  push:
    branches:
      - main
    paths:
      - 'blog/articles/**'
      - 'blog/posts.json'
      - 'index.html'
      - 'blog/index.html'
      - 'articles/index.html'
      - 'terms-of-service.html'
      - 'privacy-policy.html'
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is required so lastmod can be derived from the last
          # commit that actually touched each page's source file.
          fetch-depth: 0

      - name: Update sitemap.xml lastmod dates (evidence-based)
        run: |
          echo "Updating sitemap lastmod from per-file git history…"

          # Each <loc>'s lastmod is set to the date of the last commit that
          # modified that page's source file — NOT the run date. Unchanged
          # pages keep their real last-modified date, so lastmod stays honest.
          python3 - << 'PYEOF'
          import re, subprocess, sys

          with open('sitemap.xml', 'r') as f:
              xml = f.read()

          def source_file_for(url):
              path = url.replace('https://victorndunda.com', '') or '/'
              path = path.strip('/')
              if not path:
                  return 'index.html'
              if path.endswith('/'):
                  return path + 'index.html'
              return path

          def last_commit_date(path):
              try:
                  out = subprocess.run(
                      ['git', 'log', '-1', '--format=%as', '--', path],
                      capture_output=True, text=True, check=True
                  ).stdout.strip()
                  return out if out else None
              except subprocess.CalledProcessError:
                  return None

          def fix_url_block(m):
              block = m.group(0)
              loc = re.search(r'<loc>(.*?)</loc>', block)
              if not loc:
                  return block
              src = source_file_for(loc.group(1))
              date = last_commit_date(src)
              if not date:
                  # Fall back to file modification time for untracked files
                  import os, datetime
                  if os.path.exists(src):
                      date = datetime.date.fromtimestamp(
                          os.path.getmtime(src)).isoformat()
                      print(f"  ! no git history for {src}; using mtime {date}", file=sys.stderr)
              if not date:
                  print(f"  ! no date found for {src}; leaving lastmod unchanged", file=sys.stderr)
                  return block
              new_block, n = re.subn(r'<lastmod>[^<]*</lastmod>',
                                     f'<lastmod>{date}</lastmod>', block, count=1)
              if n == 0:
                  # No lastmod element: insert one after <loc>
                  new_block = block.replace(
                      f'<loc>{loc.group(1)}</loc>',
                      f'<loc>{loc.group(1)}</loc>\n    <lastmod>{date}</lastmod>', 1)
              return new_block

          xml = re.sub(r'<url>.*?</url>', fix_url_block, xml, flags=re.S)
          with open('sitemap.xml', 'w') as f:
              f.write(xml)
          print("sitemap.xml lastmod dates updated from git history.")
          PYEOF

          # Show the result
          echo "Updated sitemap.xml:"
          cat sitemap.xml

      - name: Auto-generate feed.xml from posts.json
        run: |
          echo "Generating feed.xml from blog/posts.json..."
          python3 - << 'PYEOF'
          import json, datetime
          from html import escape

          with open('blog/posts.json', 'r') as f:
              data = json.load(f)

          posts = sorted(data.get('posts', []), key=lambda p: p.get('date', ''), reverse=True)
          author = data.get('author', {})
          site = data.get('site', {})
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%a, %d %b %Y %H:%M:%S +0000')

          items = []
          for post in posts:
              title = escape(post.get('title', ''))
              url = f"https://victorndunda.com{post.get('url', '')}"
              excerpt = escape(post.get('excerpt', ''))
              try:
                  dt = datetime.datetime.strptime(post.get('date', ''), '%Y-%m-%d')
                  pub_date = dt.strftime('%a, %d %b %Y %H:%M:%S +0000')
              except:
                  pub_date = now
              tags = post.get('tags', [])
              cats = '\n'.join(f'      <category>{escape(t)}</category>' for t in tags)
              items.append(f"""    <item>
              <title>{title}</title>
              <link>{url}</link>
              <guid isPermaLink="true">{url}</guid>
              <pubDate>{pub_date}</pubDate>
              <description>{excerpt}</description>
              <content:encoded><![CDATA[<p>{post.get('excerpt', '')}</p><p>Read time: {post.get('readTime', 'N/A')} · Word count: {post.get('wordCount', 'N/A')}</p><p><a href="{url}">Read full article →</a></p>]]></content:encoded>
              <author>{escape(author.get('email', 'mututandunda@gmail.com'))} ({escape(author.get('name', 'Victor Ndunda'))})</author>{cats}
            </item>""")

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <?xml-stylesheet type="text/xsl" href="/feed.xsl"?>
          <rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom" xmlns:content="http://purl.org/rss/1.0/modules/content/">
            <channel>
              <title>{escape(site.get('name', 'Victor Ndunda'))} — Blog</title>
              <link>https://victorndunda.com/blog/</link>
              <atom:link href="https://victorndunda.com/feed.xml" rel="self" type="application/rss+xml" />
              <description>{escape(site.get('description', ''))}</description>
              <language>en-us</language>
              <lastBuildDate>{now}</lastBuildDate>
              <managingEditor>{escape(author.get('email', 'mututandunda@gmail.com'))} ({escape(author.get('name', 'Victor Ndunda'))})</managingEditor>
              <image>
                <url>https://victorndunda.com/og-image.png</url>
                <title>{escape(site.get('name', 'Victor Ndunda'))} — Blog</title>
                <link>https://victorndunda.com/blog/</link>
              </image>
          {chr(10).join(items)}
            </channel>
          </rss>
          """
          with open('feed.xml', 'w') as f:
              f.write(rss)
          print(f"Generated feed.xml with {len(posts)} articles")
          PYEOF

      - name: Commit if changed
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "No changes to sitemap.xml or feed.xml"
          else
            git commit -m "chore: Auto-update sitemap & feed ($TODAY)"
            git push
            echo "✓ Committed and pushed updates"
          fi
